AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  PlayMate Discord serverless (option 3: PostgreSQL outbox + SQS + Lambda) - send/result queues and Discord Worker
  Lambdas for career share, and optionally HOT share and comment/reply DM. No DB layer, no EventBridge Scheduler,
  no VPC/NAT. See DEPLOY.md.

# 명명 규칙: playmate-<EnvironmentName>-<feature>-<role>
#   feature = career-share | hot-share | dm-share (HOT·DM은 같은 패턴으로 리소스를 추가한다)
#   role    = send | send-dlq | result | result-dlq | worker
# 이 템플릿은 DB 처리 계층(DB Lambda 또는 EC2 실행기)과 Scheduler를 만들지 않는다. 결과 큐는 소비자가 생길 때까지 쌓인다.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [test, prod]
    Default: test
    Description: Resource name prefix (playmate-<env>-...). test and prod stacks never share queues or functions.

  CareerShareChannelId:
    Type: String
    AllowedPattern: "^[0-9]{17,20}$"
    ConstraintDescription: Discord channel snowflake (17-20 digits).
    Description: >-
      Discord channel ID the career Worker posts to. No default on purpose - pass a TEST channel first. Never hard-code
      the production channel here.

  DiscordBotTokenSecretArn:
    Type: String
    AllowedPattern: "^arn:aws[a-zA-Z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$"
    ConstraintDescription: Full Secrets Manager secret ARN.
    Description: >-
      Existing Secrets Manager secret that holds the Discord bot token (created outside this stack). The token value is
      read at Lambda cold start; it is never stored in the template or Lambda environment.

  DiscordBotTokenSecretJsonKey:
    Type: String
    Default: ""
    AllowedPattern: "^[A-Za-z0-9_.-]{0,64}$"
    Description: Leave empty if the secret value is the raw token. If the secret is JSON, the key that holds the token.

  DiscordBotTokenSecretKmsKeyArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/.+$"
    Description: Leave empty when the secret uses the AWS managed key (aws/secretsmanager). Set it for a customer managed key.

  AlarmTopicArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws[a-zA-Z-]*:sns:[a-z0-9-]+:[0-9]{12}:.+$"
    Description: Existing SNS topic for alarm notifications. Empty = alarms are created without actions.

  CareerWorkerEventSourceEnabled:
    Type: String
    AllowedValues: ["false", "true"]
    Default: "false"
    Description: >-
      SQS -> Worker event source mapping. Default false: deploying never starts Discord posting. Enable only for a
      test-channel run (see DEPLOY.md 6).

  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]

  ThrottleAlarmThreshold:
    Type: Number
    Default: 1
    MinValue: 1
    Description: >-
      Throttles per 5 minutes before alarming. Reserved concurrency equals the event source MaximumConcurrency (2), so
      throttles are not expected; any throttle means the account/function concurrency changed.

  DiscordBotTokenVersion:
    Type: String
    Default: "1"
    AllowedPattern: "^[A-Za-z0-9._-]{1,32}$"
    Description: >-
      Bump after rotating the token secret. Changing it updates the function configuration so Lambda retires execution
      environments that cached the old token (see DEPLOY.md 5).

  # ------------------------------------------------------------------ HOT / DM (Issue #182). 기본은 만들지 않는다 (취업만 배포하는 기존 명령 유지)
  DeployHotShare:
    Type: String
    AllowedValues: ["false", "true"]
    Default: "false"
    Description: Create the HOT share queues, Worker and alarms.

  HotShareChannelId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9]{17,20}$"
    ConstraintDescription: Empty, or a Discord channel snowflake (17-20 digits).
    Description: >-
      Discord channel the HOT Worker posts to (required when DeployHotShare=true). Pass a TEST channel first; never
      hard-code the production channel here.

  HotWorkerEventSourceEnabled:
    Type: String
    AllowedValues: ["false", "true"]
    Default: "false"
    Description: SQS -> HOT Worker event source mapping. Default false (deploying never starts posting).

  DeployDmShare:
    Type: String
    AllowedValues: ["false", "true"]
    Default: "false"
    Description: Create the comment/reply DM queues, Worker and alarms. The DM recipient comes from each job (no channel parameter).

  DmWorkerEventSourceEnabled:
    Type: String
    AllowedValues: ["false", "true"]
    Default: "false"
    Description: >-
      SQS -> DM Worker event source mapping. Default false. Enable only after the Gateway DM poller is switched over
      (playmate-discord-bot/dm_share/DEPLOY.md 5).

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, ""]]
  HasSecretKmsKey: !Not [!Equals [!Ref DiscordBotTokenSecretKmsKeyArn, ""]]
  EnableCareerWorker: !Equals [!Ref CareerWorkerEventSourceEnabled, "true"]
  CreateHotShare: !Equals [!Ref DeployHotShare, "true"]
  EnableHotWorker: !And [!Condition CreateHotShare, !Equals [!Ref HotWorkerEventSourceEnabled, "true"]]
  CreateDmShare: !Equals [!Ref DeployDmShare, "true"]
  EnableDmWorker: !And [!Condition CreateDmShare, !Equals [!Ref DmWorkerEventSourceEnabled, "true"]]

Rules:
  HotShareNeedsChannel:
    RuleCondition: !Equals [!Ref DeployHotShare, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref HotShareChannelId, ""]]
        AssertDescription: HotShareChannelId is required when DeployHotShare=true.
  # DM Worker 동시성은 현재 범위에서 안전성이 입증되지 않았다 (DEPLOY.md 15.4): 예약 1 < 이벤트 소스 최대 2(AWS 권장 위반, 스로틀),
  # 예약 2는 R4 중복 방지 전제 위반. FIFO 전환(발행 코드 변경, 후속 Issue) 전에는 운영 환경에서 DM 이벤트 소스를 켤 수 없게 막는다.
  DmWorkerNotInProdUntilFifo:
    RuleCondition: !Equals [!Ref EnvironmentName, prod]
    Assertions:
      - Assert: !Equals [!Ref DmWorkerEventSourceEnabled, "false"]
        AssertDescription: >-
          DmWorkerEventSourceEnabled must stay false in prod until the DM send queue moves to FIFO (see DEPLOY.md 15.4).

Resources:
  # ------------------------------------------------------------------ 취업 공유 큐 (표준 큐, SQS 관리형 암호화)
  CareerShareSendDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub playmate-${EnvironmentName}-career-share-send-dlq
      MessageRetentionPeriod: 1209600          # 14일: 사람이 원인을 확인할 시간
      SqsManagedSseEnabled: true

  CareerShareSendQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub playmate-${EnvironmentName}-career-share-send
      # Worker Timeout(90초) x 6 = 540초 (AWS 권장). 처리 실패로 보고된 메시지는 이 시간 뒤 다시 보인다.
      # 작업 TTL(10분)과 비슷해, 일시 오류 뒤 재수신은 대개 TTL 경과 -> Worker가 UNKNOWN/EXPIRED로 끝내고 DB가 복구한다.
      VisibilityTimeout: 540
      # 작업의 not_after는 10분(CAREER_SHARE_JOB_TTL_MINUTES)이다. 그보다 오래된 작업은 Worker가 보내지 않으므로 1일이면 충분하다.
      MessageRetentionPeriod: 86400
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CareerShareSendDLQ.Arn
        # 예약 동시성 = 이벤트 소스 최대 동시성이라 구조적 스로틀이 없다. 일시 오류 재수신 5회(약 45분)면 TTL(10분)을 넘어
        # Worker가 UNKNOWN/EXPIRED 결과로 끝내므로, DLQ에는 형식 오류·결과 발행 반복 실패만 남는다.
        maxReceiveCount: 5

  CareerShareResultDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub playmate-${EnvironmentName}-career-share-result-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  CareerShareResultQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub playmate-${EnvironmentName}-career-share-result
      # 소비자(DB 처리 계층)는 아직 없다. 생기면 그 소비자 타임아웃 x 6 이상인지 다시 확인한다.
      VisibilityTimeout: 360
      MessageRetentionPeriod: 1209600          # 14일(최대): 소비자가 배포되기 전 시험 결과를 잃지 않게
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CareerShareResultDLQ.Arn
        maxReceiveCount: 5

  # ------------------------------------------------------------------ Worker 로그·역할·함수
  CareerShareWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/playmate-${EnvironmentName}-career-share-worker
      RetentionInDays: !Ref LogRetentionInDays

  CareerShareWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: PlayMate career share Discord Worker - send queue consume, result queue send, token secret read only.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: career-share-worker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt CareerShareWorkerLogGroup.Arn
              - Sid: ConsumeSendQueue
                Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt CareerShareSendQueue.Arn
              - Sid: PublishResults
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt CareerShareResultQueue.Arn
              - Sid: ReadDiscordTokenSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DiscordBotTokenSecretArn
              - !If
                - HasSecretKmsKey
                - Sid: DecryptTokenSecretViaSecretsManager
                  Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref DiscordBotTokenSecretKmsKeyArn
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com
                - !Ref AWS::NoValue

  CareerShareWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub playmate-${EnvironmentName}-career-share-worker
      Description: Career share Discord Worker (outside VPC, no DB access). Reuses career_share.worker_lambda.handler.
      # build_package.py가 만든 최소 패키지 (career_share 발송 모듈 + discord_rest core + secret_bootstrap).
      CodeUri: .build/career_worker/
      Handler: secret_bootstrap.handler
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 90
      Role: !GetAtt CareerShareWorkerRole.Arn
      # 이벤트 소스 최대 동시성(2, AWS 최솟값)과 같게 둔다 (AWS 권장: 예약 동시성 >= 최대 동시성).
      # 1로 두면 이벤트 소스가 2개까지 호출해 스로틀이 상시 발생하고, 스로틀된 메시지는 가시성 타임아웃 안에서 재시도되다
      # 작업 TTL(10분)을 넘길 수 있다. 같은 메시지의 동시 처리는 가시성 타임아웃(540초 > 함수 90초)이 막고,
      # 남는 경우는 SQS의 드문 "동시 중복 전달"뿐이다 (DEPLOY.md 3절 남은 위험).
      ReservedConcurrentExecutions: 2
      LoggingConfig:
        LogGroup: !Ref CareerShareWorkerLogGroup
        LogFormat: Text
      # VpcConfig 없음: Discord(인터넷)와 SQS 공개 엔드포인트로 바로 나간다. NAT가 필요 없다.
      Environment:
        Variables:
          WORKER_TARGET_HANDLER: career_share.worker_lambda.handler
          DISCORD_BOT_TOKEN_SECRET_ARN: !Ref DiscordBotTokenSecretArn
          DISCORD_BOT_TOKEN_SECRET_JSON_KEY: !Ref DiscordBotTokenSecretJsonKey
          CAREER_SHARE_CHANNEL_ID: !Ref CareerShareChannelId
          CAREER_SHARE_RESULT_QUEUE_URL: !Ref CareerShareResultQueue
          PLAYMATE_ENVIRONMENT: !Ref EnvironmentName
          # 값 자체는 쓰지 않는다. 토큰 교체 뒤 이 값을 바꾸면 함수 설정이 갱신되어 이전 토큰을 캐시한 실행 환경이 교체된다.
          DISCORD_BOT_TOKEN_VERSION: !Ref DiscordBotTokenVersion

  # SAM Events 대신 명시적 매핑: Enabled에 조건식(!If)을 확실히 쓰고, 출력에서 UUID를 바로 참조한다.
  CareerShareWorkerSendQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt CareerShareSendQueue.Arn
      FunctionName: !Ref CareerShareWorkerFunction
      BatchSize: 1
      MaximumBatchingWindowInSeconds: 0
      FunctionResponseTypes: [ReportBatchItemFailures]
      Enabled: !If [EnableCareerWorker, true, false]
      # 최솟값 2 (1은 허용되지 않음). 함수 예약 동시성(2)과 같게 둔다.
      ScalingConfig:
        MaximumConcurrency: 2

  # ------------------------------------------------------------------ 경보 (AlarmTopicArn이 비면 동작 없이 만든다)
  CareerShareWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub playmate-${EnvironmentName}-career-share-worker-errors
      AlarmDescription: Worker invocation errors (e.g. token secret load failure). Per-message failures are reported separately.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref CareerShareWorkerFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  CareerShareWorkerThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub playmate-${EnvironmentName}-career-share-worker-throttles
      AlarmDescription: Worker throttles above threshold (reserved concurrency 1). Sustained throttling delays posts.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{Name: FunctionName, Value: !Ref CareerShareWorkerFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref ThrottleAlarmThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  # handle_records는 메시지별 오류를 잡아 batchItemFailures로 돌려준다 (Lambda Errors에는 잡히지 않음). ERROR 로그로 따로 센다.
  CareerShareWorkerErrorLogMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CareerShareWorkerLogGroup
      FilterPattern: '"[ERROR]"'
      MetricTransformations:
        - MetricNamespace: PlayMate/DiscordServerless
          MetricName: !Sub ${EnvironmentName}-career-share-worker-error-logs
          MetricValue: "1"
          DefaultValue: 0

  CareerShareWorkerErrorLogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub playmate-${EnvironmentName}-career-share-worker-error-logs
      AlarmDescription: ERROR log lines from the Worker (bad job format, permanent Discord errors, unexpected errors).
      Namespace: PlayMate/DiscordServerless
      MetricName: !Sub ${EnvironmentName}-career-share-worker-error-logs
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  CareerShareSendDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub playmate-${EnvironmentName}-career-share-send-dlq-not-empty
      AlarmDescription: Send jobs moved to the DLQ (bad format or repeated failures). Inspect before discarding.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt CareerShareSendDLQ.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  CareerShareResultDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub playmate-${EnvironmentName}-career-share-result-dlq-not-empty
      AlarmDescription: Results moved to the DLQ (DB layer could not apply them). Redrive after the DB layer is fixed.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt CareerShareResultDLQ.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  CareerShareSendQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub playmate-${EnvironmentName}-career-share-send-queue-stale
      AlarmDescription: >-
        Oldest send job is older than the job TTL (10 min). Worker is disabled, throttled or failing; such jobs will not be
        posted (EXPIRED/UNKNOWN) and the DB layer must recover them.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{Name: QueueName, Value: !GetAtt CareerShareSendQueue.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 600
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  # 결과 소비자(DB 처리 계층)가 없거나 멈추면 결과가 쌓이고, 14일 보존을 넘기면 결과가 사라져 DB가 SENT를 모르게 된다.
  # 소비자 배포 전에는 시험 결과를 지우지 않는 한 계속 ALARM이다 (의도: 결과를 방치하지 않게).
  CareerShareResultQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub playmate-${EnvironmentName}-career-share-result-queue-stale
      AlarmDescription: >-
        Oldest result is older than 1 hour - the DB layer is not consuming results. Results expire after 14 days and are
        then lost (the DB would never learn about SENT posts).
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{Name: QueueName, Value: !GetAtt CareerShareResultQueue.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3600
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  # ================================================================== HOT 게시글 공유 (Issue #182)
  # 기존 hot_share.worker_lambda.handler 재사용: HOT 작업(kind=HOT, unit hot-<id>)만 처리하고 다른 작업은 Discord 호출 전에 거부한다.
  # 공개 범위 판단은 DB 계층(선점 SQL)에 있다. Worker에는 새 판단 로직이 없다.
  HotShareSendDLQ:
    Type: AWS::SQS::Queue
    Condition: CreateHotShare
    # 기능을 끄거나(Deploy*=false) 스택을 지워도 큐·메시지를 남긴다 (DEPLOY.md 15.9). 교체가 필요한 변경도 기존 큐를 지우지 않는다.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub playmate-${EnvironmentName}-hot-share-send-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  HotShareSendQueue:
    Type: AWS::SQS::Queue
    Condition: CreateHotShare
    # 기능을 끄거나(Deploy*=false) 스택을 지워도 큐·메시지를 남긴다 (DEPLOY.md 15.9). 교체가 필요한 변경도 기존 큐를 지우지 않는다.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub playmate-${EnvironmentName}-hot-share-send
      VisibilityTimeout: 540                   # Worker Timeout 90초 x 6
      MessageRetentionPeriod: 86400            # 작업 TTL은 3분(HOT_SHARE_JOB_TTL_MINUTES)
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt HotShareSendDLQ.Arn
        maxReceiveCount: 5                     # 예약 동시성 = 최대 동시성이라 구조적 스로틀 없음 (취업과 같은 근거)

  HotShareResultDLQ:
    Type: AWS::SQS::Queue
    Condition: CreateHotShare
    # 기능을 끄거나(Deploy*=false) 스택을 지워도 큐·메시지를 남긴다 (DEPLOY.md 15.9). 교체가 필요한 변경도 기존 큐를 지우지 않는다.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub playmate-${EnvironmentName}-hot-share-result-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  HotShareResultQueue:
    Type: AWS::SQS::Queue
    Condition: CreateHotShare
    # 기능을 끄거나(Deploy*=false) 스택을 지워도 큐·메시지를 남긴다 (DEPLOY.md 15.9). 교체가 필요한 변경도 기존 큐를 지우지 않는다.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub playmate-${EnvironmentName}-hot-share-result
      VisibilityTimeout: 360
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt HotShareResultDLQ.Arn
        maxReceiveCount: 5

  HotShareWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateHotShare
    Properties:
      LogGroupName: !Sub /aws/lambda/playmate-${EnvironmentName}-hot-share-worker
      RetentionInDays: !Ref LogRetentionInDays

  HotShareWorkerRole:
    Type: AWS::IAM::Role
    Condition: CreateHotShare
    Properties:
      Description: PlayMate HOT share Discord Worker - send queue consume, result queue send, token secret read only.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: hot-share-worker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt HotShareWorkerLogGroup.Arn
              - Sid: ConsumeSendQueue
                Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt HotShareSendQueue.Arn
              - Sid: PublishResults
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt HotShareResultQueue.Arn
              - Sid: ReadDiscordTokenSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DiscordBotTokenSecretArn
              - !If
                - HasSecretKmsKey
                - Sid: DecryptTokenSecretViaSecretsManager
                  Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref DiscordBotTokenSecretKmsKeyArn
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com
                - !Ref AWS::NoValue

  HotShareWorkerFunction:
    Type: AWS::Serverless::Function
    Condition: CreateHotShare
    Properties:
      FunctionName: !Sub playmate-${EnvironmentName}-hot-share-worker
      Description: HOT share Discord Worker (outside VPC, no DB access). Reuses hot_share.worker_lambda.handler.
      CodeUri: .build/hot_worker/
      Handler: secret_bootstrap.handler
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 90
      Role: !GetAtt HotShareWorkerRole.Arn
      # 취업과 같은 근거로 2 (= 이벤트 소스 최대 동시성). HOT 재선점은 재시도 간격(5분 x 시도)이 TTL(3분)과 함수 타임아웃(90초)보다
      # 길어, 이전 작업이 실행 중일 때 새 작업이 동시에 처리되는 경우가 없다. 남는 것은 SQS 동시 중복 전달뿐 (DEPLOY.md 3절).
      ReservedConcurrentExecutions: 2
      LoggingConfig:
        LogGroup: !Ref HotShareWorkerLogGroup
        LogFormat: Text
      Environment:
        Variables:
          WORKER_TARGET_HANDLER: hot_share.worker_lambda.handler
          DISCORD_BOT_TOKEN_SECRET_ARN: !Ref DiscordBotTokenSecretArn
          DISCORD_BOT_TOKEN_SECRET_JSON_KEY: !Ref DiscordBotTokenSecretJsonKey
          DISCORD_BOT_TOKEN_VERSION: !Ref DiscordBotTokenVersion
          HOT_SHARE_CHANNEL_ID: !Ref HotShareChannelId
          HOT_SHARE_RESULT_QUEUE_URL: !Ref HotShareResultQueue
          PLAYMATE_ENVIRONMENT: !Ref EnvironmentName

  HotShareWorkerSendQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: CreateHotShare
    Properties:
      EventSourceArn: !GetAtt HotShareSendQueue.Arn
      FunctionName: !Ref HotShareWorkerFunction
      BatchSize: 1
      MaximumBatchingWindowInSeconds: 0
      FunctionResponseTypes: [ReportBatchItemFailures]
      Enabled: !If [EnableHotWorker, true, false]
      ScalingConfig:
        MaximumConcurrency: 2

  HotShareWorkerErrorLogMetric:
    Type: AWS::Logs::MetricFilter
    Condition: CreateHotShare
    Properties:
      LogGroupName: !Ref HotShareWorkerLogGroup
      FilterPattern: '"[ERROR]"'
      MetricTransformations:
        - MetricNamespace: PlayMate/DiscordServerless
          MetricName: !Sub ${EnvironmentName}-hot-share-worker-error-logs
          MetricValue: "1"
          DefaultValue: 0

  # 경보는 기능당 4개로 줄인다 (취업 7개를 복제하지 않음): Lambda Errors·Throttles·ERROR 로그를 지표 수학 1개로 합치고, 두 DLQ를 1개로 합친다.
  HotShareWorkerFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateHotShare
    Properties:
      AlarmName: !Sub playmate-${EnvironmentName}-hot-share-worker-failures
      AlarmDescription: HOT Worker invocation errors (incl. timeouts), throttles (not expected) or ERROR log lines. Check the log group.
      Metrics:
        - Id: errors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions: [{Name: FunctionName, Value: !Ref HotShareWorkerFunction}]
            Period: 300
            Stat: Sum
        - Id: throttles
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions: [{Name: FunctionName, Value: !Ref HotShareWorkerFunction}]
            Period: 300
            Stat: Sum
        - Id: errorlogs
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: PlayMate/DiscordServerless
              MetricName: !Sub ${EnvironmentName}-hot-share-worker-error-logs
            Period: 300
            Stat: Sum
        - Id: failures
          Expression: FILL(errors, 0) + FILL(throttles, 0) + FILL(errorlogs, 0)
          Label: HOT worker failures
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  HotShareDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateHotShare
    Properties:
      AlarmName: !Sub playmate-${EnvironmentName}-hot-share-dlq-not-empty
      AlarmDescription: HOT send or result DLQ has messages. Inspect both DLQs.
      Metrics:
        - Id: senddlq
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions: [{Name: QueueName, Value: !GetAtt HotShareSendDLQ.QueueName}]
            Period: 300
            Stat: Maximum
        - Id: resultdlq
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions: [{Name: QueueName, Value: !GetAtt HotShareResultDLQ.QueueName}]
            Period: 300
            Stat: Maximum
        - Id: dlq
          Expression: FILL(senddlq, 0) + FILL(resultdlq, 0)
          Label: HOT DLQ messages
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  HotShareSendQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateHotShare
    Properties:
      AlarmName: !Sub playmate-${EnvironmentName}-hot-share-send-queue-stale
      AlarmDescription: Oldest HOT send job is older than the job TTL (3 min) - Worker disabled, throttled or failing.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{Name: QueueName, Value: !GetAtt HotShareSendQueue.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 180
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  HotShareResultQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateHotShare
    Properties:
      AlarmName: !Sub playmate-${EnvironmentName}-hot-share-result-queue-stale
      AlarmDescription: Oldest HOT result is older than 1 hour - the DB layer is not consuming results (they expire after 14 days).
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{Name: QueueName, Value: !GetAtt HotShareResultQueue.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3600
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  # ================================================================== 댓글·대댓글 DM (Issue #182)
  # 기존 dm_share.worker_lambda.handler 재사용: DM 작업(kind=DM, unit dm-<id>)과 유효한 recipient_id만 처리한다.
  # 큐 메시지에 받는 사람 Discord ID와 게시글 제목이 들어가므로 SSE, 짧은 보존, 로그에 본문·받는 사람을 남기지 않는 기존 코드를 유지한다.
  DmShareSendDLQ:
    Type: AWS::SQS::Queue
    Condition: CreateDmShare
    # 기능을 끄거나(Deploy*=false) 스택을 지워도 큐·메시지를 남긴다 (DEPLOY.md 15.9). 교체가 필요한 변경도 기존 큐를 지우지 않는다.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub playmate-${EnvironmentName}-dm-share-send-dlq
      MessageRetentionPeriod: 604800           # 7일: 원인 확인 시간과 개인정보 보존 최소화 사이 (원본 넣은 시각 기준으로 만료)
      SqsManagedSseEnabled: true

  DmShareSendQueue:
    Type: AWS::SQS::Queue
    Condition: CreateDmShare
    # 기능을 끄거나(Deploy*=false) 스택을 지워도 큐·메시지를 남긴다 (DEPLOY.md 15.9). 교체가 필요한 변경도 기존 큐를 지우지 않는다.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub playmate-${EnvironmentName}-dm-share-send
      VisibilityTimeout: 360                   # Worker Timeout 60초 x 6
      MessageRetentionPeriod: 3600             # 작업 TTL은 50초. 오래 둘 이유가 없고 받는 사람 정보 보존을 줄인다
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DmShareSendDLQ.Arn
        # 예약 동시성 1 < 최대 동시성 2라 스로틀이 수신 횟수를 올릴 수 있다. 스로틀만으로 DLQ에 가지 않도록 여유를 둔다.
        maxReceiveCount: 10

  DmShareResultDLQ:
    Type: AWS::SQS::Queue
    Condition: CreateDmShare
    # 기능을 끄거나(Deploy*=false) 스택을 지워도 큐·메시지를 남긴다 (DEPLOY.md 15.9). 교체가 필요한 변경도 기존 큐를 지우지 않는다.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub playmate-${EnvironmentName}-dm-share-result-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  DmShareResultQueue:
    Type: AWS::SQS::Queue
    Condition: CreateDmShare
    # 기능을 끄거나(Deploy*=false) 스택을 지워도 큐·메시지를 남긴다 (DEPLOY.md 15.9). 교체가 필요한 변경도 기존 큐를 지우지 않는다.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub playmate-${EnvironmentName}-dm-share-result
      VisibilityTimeout: 360
      MessageRetentionPeriod: 1209600          # 결과에는 받는 사람 ID·본문이 없다 (unit_id, 토큰, outcome, DM 채널·메시지 ID)
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DmShareResultDLQ.Arn
        maxReceiveCount: 5

  DmShareWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateDmShare
    Properties:
      LogGroupName: !Sub /aws/lambda/playmate-${EnvironmentName}-dm-share-worker
      RetentionInDays: !Ref LogRetentionInDays

  DmShareWorkerRole:
    Type: AWS::IAM::Role
    Condition: CreateDmShare
    Properties:
      Description: PlayMate DM Discord Worker - send queue consume, result queue send, token secret read only.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: dm-share-worker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt DmShareWorkerLogGroup.Arn
              - Sid: ConsumeSendQueue
                Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt DmShareSendQueue.Arn
              - Sid: PublishResults
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt DmShareResultQueue.Arn
              - Sid: ReadDiscordTokenSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DiscordBotTokenSecretArn
              - !If
                - HasSecretKmsKey
                - Sid: DecryptTokenSecretViaSecretsManager
                  Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref DiscordBotTokenSecretKmsKeyArn
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com
                - !Ref AWS::NoValue

  DmShareWorkerFunction:
    Type: AWS::Serverless::Function
    Condition: CreateDmShare
    Properties:
      FunctionName: !Sub playmate-${EnvironmentName}-dm-share-worker
      Description: Comment/reply DM Discord Worker (outside VPC, no DB access). Reuses dm_share.worker_lambda.handler.
      CodeUri: .build/dm_worker/
      Handler: secret_bootstrap.handler
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 60
      Role: !GetAtt DmShareWorkerRole.Arn
      # 취업·HOT과 달리 1을 유지한다 (dm_share/DEPLOY.md 7절 R4). DM은 실패 후 60초 만에 재선점되므로, 429 대기 중인 이전 작업 복사본과
      # 새 작업이 동시에 처리되면 둘 다 마커를 못 찾고 DM을 두 번 보낼 수 있다. 예약 동시성 1이면 새 작업이 이전 작업 뒤에 처리되어
      # 마커로 막힌다 (test_lambda_reclaim_during_inflight_is_safe_with_concurrency_1). 이벤트 소스 최대 동시성 최솟값이 2라
      # 예약 1 < 최대 2가 되어 스로틀이 생길 수 있다 (AWS 권장 "예약 >= 최대"와 충돌). 재시도 횟수(10)는 DLQ 이동만 늦출 뿐 해결책이 아니다.
      # **임시 설정**: 시험 환경에서만 켤 수 있고 운영 활성화는 Rule(DmWorkerNotInProdUntilFifo)이 막는다 (DEPLOY.md 15.4).
      ReservedConcurrentExecutions: 1
      LoggingConfig:
        LogGroup: !Ref DmShareWorkerLogGroup
        LogFormat: Text
      Environment:
        Variables:
          WORKER_TARGET_HANDLER: dm_share.worker_lambda.handler
          DISCORD_BOT_TOKEN_SECRET_ARN: !Ref DiscordBotTokenSecretArn
          DISCORD_BOT_TOKEN_SECRET_JSON_KEY: !Ref DiscordBotTokenSecretJsonKey
          DISCORD_BOT_TOKEN_VERSION: !Ref DiscordBotTokenVersion
          DM_SHARE_RESULT_QUEUE_URL: !Ref DmShareResultQueue
          PLAYMATE_ENVIRONMENT: !Ref EnvironmentName

  DmShareWorkerSendQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: CreateDmShare
    Properties:
      EventSourceArn: !GetAtt DmShareSendQueue.Arn
      FunctionName: !Ref DmShareWorkerFunction
      BatchSize: 1
      MaximumBatchingWindowInSeconds: 0
      FunctionResponseTypes: [ReportBatchItemFailures]
      Enabled: !If [EnableDmWorker, true, false]
      ScalingConfig:
        MaximumConcurrency: 2                  # 최솟값. 실제 실행 상한은 함수 예약 동시성 1

  DmShareWorkerErrorLogMetric:
    Type: AWS::Logs::MetricFilter
    Condition: CreateDmShare
    Properties:
      LogGroupName: !Ref DmShareWorkerLogGroup
      # DM Worker는 POST 401을 ERROR 로그 없이 정상 결과(FAILED_RETRY, auth_error)로 돌려준다 (dm_share/worker_lambda.py _send).
      # 그때 남는 것은 discord_rest의 WARNING "Discord 요청 실패 …: DiscordAuthError"뿐이라 그 단어도 센다 (토큰 장애 감지).
      FilterPattern: '?"[ERROR]" ?"DiscordAuthError"'
      MetricTransformations:
        - MetricNamespace: PlayMate/DiscordServerless
          MetricName: !Sub ${EnvironmentName}-dm-share-worker-error-logs
          MetricValue: "1"
          DefaultValue: 0

  # DM 실패 경보에는 Throttles를 넣지 않는다: 예약 1 < 최대 2라 스로틀은 예상되는 동작이다. 스로틀로 생기는 지연은 발송 큐 정체 경보가 잡는다.
  DmShareWorkerFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateDmShare
    Properties:
      AlarmName: !Sub playmate-${EnvironmentName}-dm-share-worker-failures
      AlarmDescription: DM Worker invocation errors (incl. timeouts) or ERROR log lines (e.g. Discord 401). Check the log group.
      Metrics:
        - Id: errors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions: [{Name: FunctionName, Value: !Ref DmShareWorkerFunction}]
            Period: 300
            Stat: Sum
        - Id: errorlogs
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: PlayMate/DiscordServerless
              MetricName: !Sub ${EnvironmentName}-dm-share-worker-error-logs
            Period: 300
            Stat: Sum
        - Id: failures
          Expression: FILL(errors, 0) + FILL(errorlogs, 0)
          Label: DM worker failures
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  DmShareDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateDmShare
    Properties:
      AlarmName: !Sub playmate-${EnvironmentName}-dm-share-dlq-not-empty
      AlarmDescription: DM send or result DLQ has messages (send DLQ contains recipient IDs - handle as personal data).
      Metrics:
        - Id: senddlq
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions: [{Name: QueueName, Value: !GetAtt DmShareSendDLQ.QueueName}]
            Period: 300
            Stat: Maximum
        - Id: resultdlq
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions: [{Name: QueueName, Value: !GetAtt DmShareResultDLQ.QueueName}]
            Period: 300
            Stat: Maximum
        - Id: dlq
          Expression: FILL(senddlq, 0) + FILL(resultdlq, 0)
          Label: DM DLQ messages
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  DmShareSendQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateDmShare
    Properties:
      AlarmName: !Sub playmate-${EnvironmentName}-dm-share-send-queue-stale
      AlarmDescription: >-
        Oldest DM send job is older than 5 minutes (job TTL is 50 s) - Worker disabled, persistently throttled or failing.
        Such jobs are not sent (EXPIRED/UNKNOWN) and the DB layer recovers them later.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{Name: QueueName, Value: !GetAtt DmShareSendQueue.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  DmShareResultQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateDmShare
    Properties:
      AlarmName: !Sub playmate-${EnvironmentName}-dm-share-result-queue-stale
      AlarmDescription: Oldest DM result is older than 1 hour - the DB layer is not consuming results (they expire after 14 days).
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{Name: QueueName, Value: !GetAtt DmShareResultQueue.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3600
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

Outputs:
  CareerShareSendQueueUrl:
    Description: Set as CAREER_SHARE_SEND_QUEUE_URL in the DB layer (not deployed by this stack).
    Value: !Ref CareerShareSendQueue
  CareerShareSendQueueArn:
    Value: !GetAtt CareerShareSendQueue.Arn
  CareerShareSendDLQUrl:
    Value: !Ref CareerShareSendDLQ
  CareerShareResultQueueUrl:
    Description: The DB layer consumes this queue and applies results (not deployed by this stack).
    Value: !Ref CareerShareResultQueue
  CareerShareResultQueueArn:
    Value: !GetAtt CareerShareResultQueue.Arn
  CareerShareResultDLQUrl:
    Value: !Ref CareerShareResultDLQ
  CareerShareWorkerFunctionName:
    Value: !Ref CareerShareWorkerFunction
  CareerShareWorkerEventSourceMappingId:
    Description: UUID for enabling/disabling the SQS trigger (aws lambda update-event-source-mapping --uuid ...).
    Value: !Ref CareerShareWorkerSendQueueMapping

  HotShareSendQueueUrl:
    Condition: CreateHotShare
    Description: Set as HOT_SHARE_SEND_QUEUE_URL in the HOT DB layer (not deployed by this stack).
    Value: !Ref HotShareSendQueue
  HotShareResultQueueUrl:
    Condition: CreateHotShare
    Value: !Ref HotShareResultQueue
  HotShareSendDLQUrl:
    Condition: CreateHotShare
    Value: !Ref HotShareSendDLQ
  HotShareResultDLQUrl:
    Condition: CreateHotShare
    Value: !Ref HotShareResultDLQ
  HotShareWorkerFunctionName:
    Condition: CreateHotShare
    Value: !Ref HotShareWorkerFunction
  HotShareWorkerEventSourceMappingId:
    Condition: CreateHotShare
    Value: !Ref HotShareWorkerSendQueueMapping

  DmShareSendQueueUrl:
    Condition: CreateDmShare
    Description: Set as DM_SHARE_SEND_QUEUE_URL in the DM DB layer (not deployed by this stack).
    Value: !Ref DmShareSendQueue
  DmShareResultQueueUrl:
    Condition: CreateDmShare
    Value: !Ref DmShareResultQueue
  DmShareSendDLQUrl:
    Condition: CreateDmShare
    Value: !Ref DmShareSendDLQ
  DmShareResultDLQUrl:
    Condition: CreateDmShare
    Value: !Ref DmShareResultDLQ
