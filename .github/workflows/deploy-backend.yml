
name: PlayMate Backend - AWS SSM Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-backend.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: playmate-backend-deploy
  cancel-in-progress: false

env:
  BACKEND_EC2_INSTANCE_ID: ${{ vars.BACKEND_EC2_INSTANCE_ID }}

jobs:
  deploy-backend:
    if: github.ref == 'refs/heads/main'
    name: Validate, Sync and Restart PlayMate Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      # 1. GitHub 소스 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 3.13 환경 구성
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. 백엔드 Python 문법 검사
      - name: Validate Backend Python Syntax
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q backend/app
          echo "BACKEND_SYNTAX_OK"

      # 4. GitHub OIDC로 AWS 인증
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: PlayMateGitHubDeploy

      # 5. AWS 인증 확인
      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      # 6. SSM으로 코드 동기화 및 FastAPI 재시작
      - name: Deploy Backend via SSM
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="${BACKEND_EC2_INSTANCE_ID:?Missing BACKEND_EC2_INSTANCE_ID}"

          DEPLOY_SHA="${GITHUB_SHA:?Missing GITHUB_SHA}"

          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Invalid deployment commit SHA"
            exit 1
          fi

          echo "Starting PlayMate backend deployment..."
          echo "Deployment commit: $DEPLOY_SHA"

          PARAMETERS=$(jq -cn --arg sha "$DEPLOY_SHA" '{
            executionTimeout: ["900"],
            commands: [
              "set -eu",
              "echo playmate-ssm-ok",
              "systemctl is-active nginx",
              "curl -fsS --max-time 5 http://127.0.0.1/_nginx_health",
              ("sudo /usr/local/bin/playmate-deploy-prod " + $sha)
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 60 \
            --comment "PlayMate backend deployment" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Poll SSM until a terminal status is returned
          DEADLINE=$((SECONDS + 1080))

          export AWS_MAX_ATTEMPTS=2

          while (( SECONDS < DEADLINE )); do

            if RESULT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --cli-connect-timeout 5 \
              --cli-read-timeout 15 \
              --query '{Status:Status,ResponseCode:ResponseCode,StatusDetails:StatusDetails,Output:StandardOutputContent}' \
              --output json 2>&1); then

              STATUS=$(jq -er '.Status' <<< "$RESULT")
              RESPONSE_CODE=$(jq -er '.ResponseCode' <<< "$RESULT")

              echo "SSM deployment status: $STATUS"

              case "$STATUS" in
                Success)
                  if [[ "$RESPONSE_CODE" != "0" ]]; then
                    echo "ERROR: Unexpected response code"
                    exit 1
                  fi

                  ACTUAL_SHA=$(jq -r '.Output // ""' <<< "$RESULT" |
                    sed -n 's/^DEPLOYED_SHA=//p' | tail -n 1)

                  if [[ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]]; then
                    echo "ERROR: Deployment SHA verification failed"
                    exit 1
                  fi

                  if ! jq -r '.Output // ""' <<< "$RESULT" |
                    grep -Fxq "PLAYMATE_PRODUCTION_DEPLOY_SUCCESS"; then
                    echo "ERROR: Deployment success marker missing"
                    exit 1
                  fi

                  echo "DEPLOYED_SHA=$ACTUAL_SHA"
                  echo "PLAYMATE_BACKEND_DEPLOY_SUCCESS"
                  exit 0
                  ;;

                Pending|InProgress|Delayed|Cancelling)
                  sleep 5
                  ;;

                Failed|Cancelled|TimedOut)
                  echo "$RESULT"
                  echo "ERROR: Deployment failed"
                  exit 1
                  ;;

                *)
                  echo "$RESULT"
                  echo "ERROR: Unexpected SSM status"
                  exit 1
                  ;;
              esac

            else

              # SSM invocation may not be immediately available
              if [[ "$RESULT" == *InvocationDoesNotExist* ]]; then
                sleep 5
              else
                echo "$RESULT"
                echo "ERROR: Unable to verify deployment status"
                echo "Check SSM Command ID: $COMMAND_ID"
                exit 1
              fi

            fi

          done

          echo "ERROR: Deployment monitoring timed out"
          echo "Check SSM Command ID: $COMMAND_ID"
          exit 1
