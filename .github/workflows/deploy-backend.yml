
name: PlayMate Backend - AWS SSM Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-backend.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: playmate-backend-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Validate and Sync PlayMate Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # 1. GitHub 소스 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 3.13 환경 구성
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. 백엔드 Python 문법 검사
      - name: Validate Backend Python Syntax
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q backend/app
          echo "BACKEND_SYNTAX_OK"

      # 4. GitHub OIDC로 AWS 인증
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::576436419281:role/playmate-github-deploy-role
          aws-region: ap-northeast-2
          role-session-name: PlayMateGitHubDeploy

      # 5. AWS 인증 확인
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 6. SSM을 통해 EC2 상태 확인 및 코드 동기화
      - name: Sync Backend Code via SSM
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-0a0868498c1263895"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "PlayMate backend code synchronization" \
            --parameters '{"commands":["set -eu","echo playmate-ssm-ok","systemctl is-active nginx","curl -fsS --max-time 5 http://127.0.0.1/_nginx_health","sudo -iu ubuntu /usr/local/bin/playmate-sync"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # 7. SSM 명령 완료 확인
          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then

            echo "EC2 synchronization failed."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Error:StandardErrorContent}' \
              --output json || true

            exit 1
          fi

          # 8. 배포 결과 출력
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json

          echo "PlayMate backend synchronization completed."
