
name: PlayMate Backend - AWS SSM Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: playmate-backend-deploy
  cancel-in-progress: false

jobs:
  verify-ec2:
    name: Verify AWS EC2 Connection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::576436419281:role/playmate-github-deploy-role
          aws-region: ap-northeast-2
          role-session-name: PlayMateGitHubDeploy

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Check EC2 using SSM
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-0a0868498c1263895"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "PlayMate SSM connectivity test" \
            --parameters '{"commands":["set -eu","echo playmate-ssm-ok","systemctl is-active nginx","curl -fsS --max-time 5 http://127.0.0.1/_nginx_health"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Error:StandardErrorContent}' \
              --output json || true

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json
